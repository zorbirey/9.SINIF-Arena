name: 9 Sinif Arena APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - 'assets/zeus-real-v10.webp'
      - '.github/workflows/build-arena-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Android 16 SDK kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Giris ekranina Maarif Modeli bilgilendirmesi ekle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-wrapper/app/src/main/java/com/zorbirey/sinifarena/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          needle='        column.addView(tag, tagLp);\n'
          block='''        column.addView(tag, tagLp);\n\n        TextView maarifInfo = new TextView(this);\n        maarifInfo.setText("İçerikler, Türkiye Yüzyılı Maarif Modeli’nin 9. sınıf öğrenme çıktıları dikkate alınarak hazırlanmıştır. Bu uygulama MEB’in resmî uygulaması değildir.");\n        maarifInfo.setTextColor(Color.rgb(174,195,216));\n        maarifInfo.setTextSize(10);\n        maarifInfo.setGravity(Gravity.CENTER);\n        maarifInfo.setPadding(dp(10), dp(8), dp(10), 0);\n        LinearLayout.LayoutParams maarifLp = new LinearLayout.LayoutParams(\n            ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);\n        maarifLp.setMargins(dp(18), dp(2), dp(18), 0);\n        column.addView(maarifInfo, maarifLp);\n'''
          if 'Türkiye Yüzyılı Maarif Modeli’nin 9. sınıf öğrenme çıktıları' not in s:
              if needle not in s:
                  raise SystemExit('Giris ekrani ekleme noktasi bulunamadi')
              s=s.replace(needle,block,1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: APK yerel arayuzunu ve Veli Panelini hazirla
        run: |
          set -e
          mkdir -p android-wrapper/app/src/main/res/drawable-nodpi
          mkdir -p android-wrapper/app/src/main/assets

          cp android-wrapper/app/src/main/assets/index.html android-wrapper/app/src/main/assets/student.html
          cp android-wrapper/app/src/main/assets/parent-shell.html android-wrapper/app/src/main/assets/index.html

          cp assets/zeus-real-v10.webp android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp
          cp assets/zeus-real-v10.webp android-wrapper/app/src/main/res/drawable-nodpi/app_icon.webp
          cp assets/zeus-real-v10.webp android-wrapper/app/src/main/assets/zeus.webp

          file android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp
          file android-wrapper/app/src/main/assets/zeus.webp
          grep -q "9. Sınıf Arena Veli Paneli" android-wrapper/app/src/main/assets/index.html
          grep -q "student.html" android-wrapper/app/src/main/assets/index.html
          grep -q "Süre dolup test sonlandı" android-wrapper/app/src/main/assets/index.html

      - name: Gradle 9.5 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle-9.5.0-bin.zip
          echo "$PWD/gradle-9.5.0/bin" >> $GITHUB_PATH

      - name: Android 16 APK olustur
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug

      - name: APK adini hazirla
        run: |
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk 9-Sinif-Arena-Demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 9-Sinif-Arena-Android16-APK
          path: 9-Sinif-Arena-Demo.apk
          if-no-files-found: error

      - name: Son demo APK release yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-latest
          name: 9. Sınıf Arena Demo APK
          body: Android 16 uyumlu güncel 9. Sınıf Arena demo APK. Veli Paneli, Maarif Modeli bilgilendirmesi ve süre aşımı raporu dahildir.
          prerelease: true
          make_latest: false
          files: 9-Sinif-Arena-Demo.apk
