name: Validate 9. SINIF Arena static demo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check required site files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          echo "Static demo files are present. GitHub Pages publishing is handled by Settings > Pages > main / (root)."
