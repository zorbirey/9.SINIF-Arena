<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Tahtında oturan şimşekli Zeus">
<defs>
 <radialGradient id="halo" cx="50%" cy="35%" r="58%"><stop offset="0" stop-color="#45baff" stop-opacity=".55"/><stop offset=".55" stop-color="#164b9a" stop-opacity=".2"/><stop offset="1" stop-color="#020817" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a1"/><stop offset=".45" stop-color="#e5b747"/><stop offset="1" stop-color="#8e6116"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#174fb6"/><stop offset="1" stop-color="#071c63"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5cc91"/><stop offset="1" stop-color="#c98049"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#d8e6f4"/><stop offset="1" stop-color="#87a8c8"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="eye" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="400" cy="430" rx="355" ry="390" fill="url(#halo)"/>
