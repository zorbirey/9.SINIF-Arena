<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#020817"><title>9. Sınıf Arena</title><style>html,body{margin:0;width:100%;height:100%;background:#020817;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#020817}</style></head><body><iframe id="arena" src="../index.html?mobile=1&v=13206" title="9. Sınıf Arena"></iframe><script>
const f=document.getElementById('arena');
async function txt(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(u);return r.text()}
f.addEventListener('load',async()=>{try{
 const d=f.contentDocument;if(!d)return;
 const [base,force,cover]=await Promise.all([txt('../mobile-real.css?v=6'),txt('../mobile-force.css?v=6'),txt('./assets/cover.b64?v=6')]);
 let st=d.getElementById('arenaMobileForced');if(!st){st=d.createElement('style');st.id='arenaMobileForced';d.head.appendChild(st)}
 st.textContent=base+'\n'+force;
 d.documentElement.style.setProperty('--zeus',`url("data:image/jpeg;base64,${cover.trim()}")`);
 d.documentElement.classList.add('approved-zeus-loaded');
 if(!d.getElementById('mobileResultsJs')){const s=d.createElement('script');s.id='mobileResultsJs';s.src='../mobile-results.js?v=6';d.body.appendChild(s)}
}catch(e){console.error('Mobil Arena katmanı yüklenemedi',e)}});
</script></body></html>
