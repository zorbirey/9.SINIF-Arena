<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020817"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>9. Sınıf Arena 2027</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020817;color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.screen{display:none;min-height:100vh}.screen.active{display:block}.frame{position:relative;max-width:560px;margin:0 auto;min-height:100vh;background:#020817}.frame.wide{max-width:1050px}.art{display:block;width:100%;height:auto;min-height:100vh;object-fit:contain;object-position:top center;background:#020817}.hot{position:absolute;border:0;background:transparent;z-index:4;cursor:pointer}.back{position:fixed;left:12px;top:max(12px,env(safe-area-inset-top));z-index:20;width:48px;height:48px;border-radius:50%;border:1px solid #315b82;background:rgba(2,8,23,.88);color:#fff;font-size:26px}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;color:#9db4cd}.loading b{display:block;color:#fff;font-size:24px;margin-bottom:8px}.error{color:#ff8b95}.install{position:fixed;right:10px;top:max(12px,env(safe-area-inset-top));z-index:20;border:1px solid #315b82;background:rgba(2,8,23,.9);color:#fff;border-radius:999px;padding:10px 13px;font-weight:700;font-size:12px}#app{display:none}@media(min-width:800px){.frame:not(.wide){max-width:620px}}</style></head><body><div id="loader" class="loading"><div><b>9. SINIF ARENA 2027</b>Mobil demo hazırlanıyor…</div></div><div id="app"><button id="installBtn" class="install" hidden>UYGULAMAYI YÜKLE</button><section id="cover" class="screen active"><div class="frame"><img id="coverImg" class="art" alt="9. Sınıf Arena Kapak Sayfası"><button id="enterRealArena" class="hot" style="left:6%;right:6%;top:66%;height:11%" aria-label="Arenaya Gir"></button><button class="hot" style="left:6%;right:6%;top:79%;height:10%" data-go="parentLogin" aria-label="Veli Girişi"></button></div></section><section id="parentLogin" class="screen"><button class="back" data-go="cover">‹</button><div class="frame"><img id="parentLoginImg" class="art" alt="9. Sınıf Veli Girişi"><button class="hot" style="left:7%;right:7%;top:65%;height:9%" data-go="parentPanel" aria-label="Giriş Yap"></button><button class="hot" style="left:7%;right:7%;top:77%;height:9%" data-go="parentPanel" aria-label="Demo Erişim"></button></div></section><section id="parentPanel" class="screen"><button class="back" data-go="parentLogin">‹</button><div class="frame wide"><img id="parentPanelImg" class="art" alt="9. Sınıf Arena Veli Paneli"></div></section><section id="test" class="screen"><button class="back" data-go="cover">‹</button><div class="frame"><img id="testImg" class="art" alt="9. Sınıf Arena Test Alanı"><button class="hot" style="left:6%;right:6%;bottom:8%;height:9%" data-go="result" aria-label="Sonraki Soru"></button></div></section><section id="result" class="screen"><button class="back" data-go="test">‹</button><div class="frame"><img id="resultImg" class="art" alt="9. Sınıf Arena Test Sonucu"><button class="hot" style="left:6%;right:6%;bottom:4%;height:9%" data-go="cover" aria-label="Ana Sayfaya Dön"></button></div></section></div><script>const assets={coverImg:'assets/cover.b64',parentLoginImg:'assets/parent-login.b64',parentPanelImg:'assets/parent-panel.b64',testImg:'assets/test-area.b64',resultImg:'assets/test-result.b64'};async function loadB64(path){const r=await fetch(path+'?v=3',{cache:'no-store'});if(!r.ok)throw Error(path);return'data:image/jpeg;base64,'+(await r.text()).trim()}async function boot(){try{const pairs=await Promise.all(Object.entries(assets).map(async([id,p])=>[id,await loadB64(p)]));pairs.forEach(([id,src])=>document.getElementById(id).src=src);document.getElementById('loader').remove();document.getElementById('app').style.display='block'}catch(e){document.getElementById('loader').innerHTML='<div class="error"><b>Demo açılamadı</b>Sayfayı yenileyin veya internet bağlantısını kontrol edin.</div>'}}function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));scrollTo(0,0)}document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go)});document.getElementById('enterRealArena').addEventListener('click',()=>{location.href='../index.html?source=mobile-demo&v=13200'});let promptEvent=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!promptEvent)return;promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;installBtn.hidden=true});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));boot();</script></body></html>
