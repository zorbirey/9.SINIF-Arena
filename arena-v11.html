<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020817">
<title>9. Sınıf Arena 2027 — V12</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010712;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#shell{position:fixed;inset:0;background:#010712}
#appFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#010712}
#cover{position:absolute;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 18%,rgba(31,108,180,.34),transparent 34%),linear-gradient(180deg,#06172b 0%,#020817 72%);color:#fff;text-align:center;transition:opacity .25s ease,visibility .25s ease}
#cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
.cover-inner{width:min(100%,430px);display:flex;flex-direction:column;align-items:center}
.cover-zeus{width:min(72vw,280px);height:min(42vh,330px);object-fit:cover;object-position:50% 12%;border-radius:24px;filter:contrast(1.08) saturate(1.04);box-shadow:0 22px 64px #000a,0 0 36px rgba(69,177,255,.20);border:1px solid rgba(105,199,255,.35);background:#081425}
.cover-kicker{margin-top:14px;font-size:12px;font-weight:900;letter-spacing:2.3px;color:#81dcff}
.cover-title{margin:5px 0 2px;font-size:clamp(32px,9vw,50px);font-weight:1000;line-height:.92;letter-spacing:-1.5px}
.cover-sub{margin:6px 0 15px;font-size:11px;color:#b8cde0;letter-spacing:.7px}
#enterArena{width:min(100%,300px);border:0;border-radius:15px;padding:14px 18px;background:linear-gradient(135deg,#1777d2,#3bb8ff);color:#fff;font-size:15px;font-weight:950;letter-spacing:.8px;box-shadow:0 10px 28px rgba(46,159,239,.32)}
#enterArena:active{transform:scale(.985)}
.version{margin-top:9px;font-size:10px;color:#6f8aa4}
</style>
</head>
<body>
<div id="shell">
  <iframe id="appFrame" src="index.html?v=12" title="9. Sınıf Arena"></iframe>
  <section id="cover" aria-label="9. Sınıf Arena giriş ekranı">
    <div class="cover-inner">
      <img class="cover-zeus" src="https://raw.githubusercontent.com/zorbirey/LGS2027-Arena/main/assets/zeus-real-v09.webp" alt="Zeus">
      <div class="cover-kicker">9. SINIF</div>
      <h1 class="cover-title">ARENA 2027</h1>
      <p class="cover-sub">ÇALIŞ • ÖĞREN • GELİŞ • ZİRVEYE ÇIK</p>
      <button id="enterArena" type="button">ARENAYA GİR</button>
      <div class="version">Android 16 uyumlu V12</div>
    </div>
  </section>
</div>
<script>
(() => {
  const frame = document.getElementById('appFrame');
  const cover = document.getElementById('cover');
  const enter = document.getElementById('enterArena');
  const ZEUS = 'https://raw.githubusercontent.com/zorbirey/LGS2027-Arena/main/assets/zeus-real-v09.webp';

  function injectFixes(){
    let doc;
    try { doc = frame.contentDocument || frame.contentWindow.document; } catch(e) { return; }
    if(!doc || !doc.head || !doc.body) return;

    if(!doc.getElementById('v12FixStyle')){
      const style = doc.createElement('style');
      style.id = 'v12FixStyle';
      style.textContent = `
        :root{--nav:58px!important}
        body{padding-bottom:58px!important}
        .bottom-nav{position:fixed!important;left:0!important;right:0!important;bottom:0!important;height:58px!important;min-height:58px!important;max-height:58px!important;padding:0 4px env(safe-area-inset-bottom)!important;display:grid!important;grid-template-columns:repeat(5,1fr)!important;align-items:center!important;z-index:1000!important;overflow:hidden!important}
        .bottom-nav button{height:58px!important;min-height:58px!important;max-height:58px!important;padding:5px 2px!important;margin:0!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:2px!important}
        .bottom-nav button i{font-size:18px!important;line-height:18px!important;margin:0!important}
        .bottom-nav button span{font-size:9px!important;line-height:10px!important;margin:0!important}
        .view{padding-bottom:68px!important}
        .lesson-grid{gap:10px!important;padding-bottom:10px!important}
        .lesson-grid .lesson,.lesson-grid button{min-height:104px!important;padding:12px 10px!important;border-radius:16px!important}
        .lesson-grid .lesson b,.lesson-grid button b{font-size:14px!important;line-height:1.15!important;margin-top:6px!important}
        .lesson-grid .lesson small,.lesson-grid button small{font-size:10.5px!important;line-height:1.25!important;margin-top:5px!important}
        .lesson-grid .lesson i,.lesson-grid button i{font-size:28px!important}
        .quick-grid button b{font-size:11px!important}.quick-grid button small{font-size:9px!important}
        #v12Watermark{position:fixed;left:50%;top:51%;transform:translate(-50%,-50%);width:min(68vw,300px);max-height:54vh;object-fit:contain;opacity:.16;filter:grayscale(.08) contrast(1.08);pointer-events:none;z-index:15!important}
        .view,.topbar{position:relative;z-index:10}
        .topbar{z-index:30!important}.overlay{z-index:2000!important}
        .zeus-avatar,.zeus-face,.zeus-big{background-image:url('${ZEUS}')!important;background-size:cover!important;background-position:50% 14%!important;background-repeat:no-repeat!important;color:transparent!important;box-shadow:inset 0 0 0 1px rgba(120,210,255,.18)}
        .zeus-avatar{display:inline-block!important;width:32px!important;height:32px!important;border-radius:50%!important}
        .zeus-face{display:inline-block!important;min-width:52px!important;min-height:52px!important;border-radius:14px!important}
        .zeus-big{display:block!important;min-width:105px!important;min-height:132px!important;border-radius:18px!important}
        @media(max-width:380px){
          :root{--nav:54px!important}
          body{padding-bottom:54px!important}
          .bottom-nav,.bottom-nav button{height:54px!important;min-height:54px!important;max-height:54px!important}
          .bottom-nav button i{font-size:17px!important}.bottom-nav button span{font-size:8.5px!important}
          .view{padding-bottom:62px!important}
          .lesson-grid .lesson,.lesson-grid button{min-height:96px!important}
          .lesson-grid .lesson b,.lesson-grid button b{font-size:13px!important}
        }
      `;
      doc.head.appendChild(style);
    }

    if(!doc.getElementById('v12Watermark')){
      const img = doc.createElement('img');
      img.id='v12Watermark';
      img.alt='';
      img.setAttribute('aria-hidden','true');
      img.src=ZEUS;
      doc.body.appendChild(img);
    }

    doc.querySelectorAll('.zeus-avatar,.zeus-face,.zeus-big').forEach(el => {
      el.style.backgroundImage = `url("${ZEUS}")`;
    });
  }

  frame.addEventListener('load', () => {
    injectFixes();
    setTimeout(injectFixes,250);
    setTimeout(injectFixes,900);
  });

  enter.addEventListener('click', () => {
    cover.classList.add('hidden');
    injectFixes();
  });

  window.addEventListener('pageshow', () => {
    cover.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
